name: Workbench one-time reviewed schema migration

# Temporary branch only. Reviewed change: add push_subscriptions and its user
# index; no existing table, column, or index is altered or removed.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: workbench-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.repository.private == false &&
      github.ref == 'refs/heads/temp/reviewed-main-migration-20261112'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      DEPLOY_SHA: e78c21c7251d034ec72fa0a6e581d931567ea681
      PREVIOUS_SHA: 6d57269f2bf3be952af89c5d0606a09c446c941e
      PREVIOUS_SCHEMA: 03580192107b6c43748c237d619c4bf7af72430a4d27772d9e513b0e670ce278
      TARGET_SCHEMA: 4dc3767fa0ea8e4c797f0150926a8f6962c1fef97d863e75a57ff81f9412ff5f
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Verify exact commit has successful main CI
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          sha = os.environ['DEPLOY_SHA']
          if not re.fullmatch(r'[a-f0-9]{40}', sha):
              raise SystemExit('完整 40 位 SHA 无效；未部署')
          repo = os.environ['REPOSITORY']
          result = subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/workflows/workbench-ci.yml/runs?head_sha={sha}&status=completed&per_page=100'])
          runs = json.loads(result)['workflow_runs']
          if not any(r['conclusion']=='success' and r['event']=='push' and r['head_branch']=='main' and r['head_sha']==sha and r['head_repository']['full_name']==repo for r in runs):
              raise SystemExit('此 main 提交尚无成功的 Workbench CI；未部署')
          comparison = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/compare/{sha}...main']))
          if comparison['status'] not in ('identical', 'ahead'):
              raise SystemExit('此提交不属于 main 当前历史；未部署')
          PY
      - name: Read CI-validated source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - name: Check authorized server credentials
        env:
          SSH_HOST: ${{ secrets.WORKBENCH_SSH_HOST }}
          SSH_USER: ${{ secrets.WORKBENCH_SSH_USER }}
          SSH_PORT: ${{ secrets.WORKBENCH_SSH_PORT }}
          SSH_KEY: ${{ secrets.WORKBENCH_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.WORKBENCH_SSH_KNOWN_HOSTS }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          required = ('SSH_HOST','SSH_USER','SSH_KEY','SSH_KNOWN_HOSTS')
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit('生产服务器部署凭据尚未配置；未部署')
          host, user = os.environ['SSH_HOST'], os.environ['SSH_USER']
          port = os.environ.get('SSH_PORT') or '22'
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9.:-]{0,252}', host) or not re.fullmatch(r'[a-z_][a-z0-9_-]{0,31}', user) or not port.isdigit() or not 1 <= int(port) <= 65535:
              raise SystemExit('服务器 SSH 配置格式错误；未部署')
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'workbench-ssh'
          directory.mkdir(mode=0o700)
          for name, value in [('key', os.environ['SSH_KEY']), ('known_hosts', os.environ['SSH_KNOWN_HOSTS'])]:
              path = directory / name
              path.write_text(value.rstrip('\n')+'\n')
              path.chmod(0o600)
          PY
          ssh-keygen -l -f "$RUNNER_TEMP/workbench-ssh/known_hosts" > /dev/null
      - name: Deploy only the reviewed schema transition
        env:
          SSH_HOST: ${{ secrets.WORKBENCH_SSH_HOST }}
          SSH_USER: ${{ secrets.WORKBENCH_SSH_USER }}
          SSH_PORT: ${{ secrets.WORKBENCH_SSH_PORT }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/workbench-$DEPLOY_SHA.tar.gz"
          python3 workbench/scripts/package_release.py --sha "$DEPLOY_SHA" --output "$archive"
          ssh_opts=(-i "$RUNNER_TEMP/workbench-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/workbench-ssh/known_hosts" -o ConnectTimeout=15)
          ssh "${ssh_opts[@]}" -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" 'umask 077; mkdir -p /srv/zhixu/incoming /srv/zhixu/releases; test -f /srv/zhixu/shared/.env'
          scp "${ssh_opts[@]}" -P "${SSH_PORT:-22}" "$archive" "$SSH_USER@$SSH_HOST:/srv/zhixu/incoming/$DEPLOY_SHA.tar.gz"
          ssh "${ssh_opts[@]}" -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" "bash -s -- $DEPLOY_SHA $PREVIOUS_SHA $PREVIOUS_SCHEMA $TARGET_SCHEMA" <<'REMOTE'
          set -euo pipefail
          umask 077
          source_sha=$1
          previous_sha=$2
          previous_schema=$3
          target_schema=$4
          [[ "$source_sha" == e78c21c7251d034ec72fa0a6e581d931567ea681 ]]
          [[ "$previous_sha" == 6d57269f2bf3be952af89c5d0606a09c446c941e ]]
          [[ "$previous_schema" =~ ^[a-f0-9]{64}$ && "$target_schema" =~ ^[a-f0-9]{64}$ ]]
          deploy_root=/srv/zhixu
          release_dir="$deploy_root/releases/$source_sha"
          if [[ ! -d "$release_dir" ]]; then
            stage=$(mktemp -d "$deploy_root/releases/.stage.XXXXXXXX")
            trap 'rm -rf -- "$stage"' EXIT
            tar -xzf "$deploy_root/incoming/$source_sha.tar.gz" --no-same-owner -C "$stage"
            [[ $(cat "$stage/SOURCE_SHA") == "$source_sha" ]]
            mv "$stage" "$release_dir"
            trap - EXIT
          fi
          [[ -f "$release_dir/SOURCE_SHA" && $(cat "$release_dir/SOURCE_SHA") == "$source_sha" ]]
          [[ $(cat "$deploy_root/state/current-sha") == "$previous_sha" ]]
          previous_release=$(readlink -f "$deploy_root/current")
          [[ "$previous_release" == "$deploy_root/releases/$previous_sha" ]]
          [[ $(cat "$previous_release/SOURCE_SHA") == "$previous_sha" ]]
          [[ $(python3 "$previous_release/scripts/ops_backup.py" schema "$previous_release/server.py") == "$previous_schema" ]]
          [[ $(python3 "$release_dir/scripts/ops_backup.py" schema "$release_dir/server.py") == "$target_schema" ]]
          reviewed_script="$release_dir/scripts/.deploy-reviewed-$source_sha.sh"
          rm -f -- "$reviewed_script"
          cp "$release_dir/scripts/deploy.sh" "$reviewed_script"
          trap 'rm -f -- "$reviewed_script"' EXIT
          python3 - "$reviewed_script" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          original = '''  [[ "$previous_schema" == "$SCHEMA_HASH" ]] || { echo 'Schema change refused before stopping app; reviewed migration and recovery plan required' >&2; exit 4; }'''
          reviewed = '''  [[ "$previous_schema" == "$REVIEWED_PREVIOUS_SCHEMA" && "$SCHEMA_HASH" == "$REVIEWED_TARGET_SCHEMA" && "$source_sha" == "$REVIEWED_TARGET_SHA" ]] || { echo 'Reviewed source or schema transition mismatch' >&2; exit 4; }'''
          if text.count(original) != 1:
              raise SystemExit('Permanent schema gate was not found exactly once')
          path.write_text(text.replace(original, reviewed))
          PY
          bash -n "$release_dir/scripts/deploy.sh"
          bash -n "$reviewed_script"
          REVIEWED_PREVIOUS_SCHEMA="$previous_schema" REVIEWED_TARGET_SCHEMA="$target_schema" REVIEWED_TARGET_SHA="$source_sha" bash "$reviewed_script" --root "$deploy_root" --sha "$source_sha"
          rm -f -- "$deploy_root/incoming/$source_sha.tar.gz"
          REMOTE
          echo '### 已完成一次性审核迁移' >> "$GITHUB_STEP_SUMMARY"
          echo '仅放行已审核的新增推送订阅表及索引；备份、健康检查和失败回退均已执行。' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/workbench-ssh"
