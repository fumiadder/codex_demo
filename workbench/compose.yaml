services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8000"
      DATA_DIR: /data
      TRUST_PROXY: "1"
    volumes:
      - workspace_data:/data
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  gateway:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      WORKSPACE_DOMAIN: ${WORKSPACE_DOMAIN:?请在.env设置已解析到服务器的域名}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  workspace_data:
  caddy_data:
  caddy_config:
